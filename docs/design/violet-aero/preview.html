<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Violet Aero — компоненты</title>
<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="components/bundle.css">
<style>
  body { padding: 32px max(16px, 4vw) 64px; }
  .pv-head { display: flex; align-items: center; gap: 20px; margin-bottom: 32px; }
  .pv-head h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 48px; letter-spacing: -0.02em; color: var(--ink); }
  .pv-head p { margin: 4px 0 0; color: var(--ink-muted); }
  .pv-block { margin: 0 0 32px; border-radius: 20px; overflow: hidden; border: 1px solid var(--lilac-line); background: var(--glass-edge); }
  .pv-name { margin: 0; padding: 12px 20px; font: 800 18px/1.3 var(--font-display); color: var(--ink); border-bottom: 1px solid var(--lilac-line); }
  .pv-name span { font-weight: 600; font-size: 14px; color: var(--ink-muted); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="components/bundle.js"></script>
</head>
<body>
<header class="pv-head"><img src="assets/logo/behappii-mark.svg" width="64" height="64" alt=""><div><h1>Violet Aero</h1><p>Frutiger Aero в фиолетовом: небо, стекло, глянец и пузыри.</p></div></header>
<div id="root"></div>
<script>
  var V = window.VioletAero, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'GlossButton', h('span', null, ' · Действия')),
    h('div', { className: 'va-row va-sky' },
      h(V.GlossButton, { size: 'lg', icon: 'arrow-right', href: '#' }, 'Обсудить проект'),
      h(V.GlossButton, { size: 'lg', variant: 'pearl', href: '#' }, 'Смотреть проекты'),
      h(V.GlossButton, { size: 'md' }, 'Связаться'))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'Eyebrow', h('span', null, ' · Метки')),
    h('div', null,
      h('div', { className: 'va-row va-sky' }, h(V.Eyebrow, null, '02 · проекты')),
      h('div', { className: 'va-row va-dusk' }, h(V.Eyebrow, { tone: 'dusk' }, '04 · контакты')))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'Tag', h('span', null, ' · Метки')),
    h('div', { className: 'va-row' },
      h(V.Tag, null, 'SvelteKit'), h(V.Tag, null, 'React Native'), h(V.Tag, null, 'Docker'),
      h(V.Tag, { tone: 'violet' }, 'Мобайл'), h(V.Tag, { tone: 'violet' }, 'SvelteKit · Next.js'))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'Icon', h('span', null, ' · Иконки')),
    h('div', { className: 'va-row', style: { color: 'var(--violet-800)' } },
      ['web','mobile','desktop','infra','design','arrow-right','arrow-up-right'].map(function (n) { return h(V.Icon, { key: n, name: n, size: 28 }); }))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'IconTile', h('span', null, ' · Иконки')),
    h('div', { className: 'va-row va-sky' },
      ['web','mobile','desktop','infra','design'].map(function (n) { return h(V.IconTile, { key: n, icon: n }); }))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'Orb', h('span', null, ' · Иконки')),
    h('div', { className: 'va-row va-sky' },
      h(V.Orb, null, '1'), h(V.Orb, null, '2'), h(V.Orb, null, '3'), h(V.Orb, { size: 'sm' }, '</>'))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'Bubble', h('span', null, ' · Атмосфера')),
    h('div', { className: 'va-row va-sky', style: { alignItems: 'flex-end' } },
      h(V.Bubble, { size: 110 }), h(V.Bubble, { size: 60 }), h(V.Bubble, { size: 28 }),
      h('div', { className: 'va-dusk', style: { display: 'flex', gap: '16px', alignItems: 'flex-end', padding: '16px', borderRadius: '20px' } },
        h(V.Bubble, { size: 72, tone: 'dusk' }), h(V.Bubble, { size: 26, tone: 'dusk' })))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'GlassCard', h('span', null, ' · Поверхности')),
    h('div', { className: 'va-row va-sky' },
      h(V.GlassCard, { radius: 'xl', padding: 'md', style: { width: '220px' } }, h('strong', null, 'xl · md')),
      h(V.GlassCard, { radius: '2xl', padding: 'lg', style: { width: '260px' } }, h('strong', null, '2xl · lg')))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'GlassNav', h('span', null, ' · Навигация')),
    h('div', { className: 'va-pad va-sky' },
      h(V.GlassNav, { brand: '[Ваше имя]', links: [{ label: 'Стек', href: '#' }, { label: 'Проекты', href: '#' }, { label: 'Подход', href: '#' }], cta: { label: 'Связаться', href: '#' } }))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'SectionHeader', h('span', null, ' · Разметка')),
    h('div', { className: 'va-pad va-sky' },
      h(V.SectionHeader, { eyebrow: '01 · стек', title: 'Один разработчик — три платформы', aside: 'Подбираю инструмент под задачу, а не задачу под инструмент.' }))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'ProjectCard', h('span', null, ' · Карточки')),
    h('div', { className: 'va-pad va-sky', style: { maxWidth: '560px' } },
      h(V.ProjectCard, { platform: 'Десктоп', title: '[Название проекта]', year: '[год]', text: '[Одно предложение: что это, для кого и какую задачу решает]', tags: ['Tauri', 'SvelteKit'] }))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'StackCard', h('span', null, ' · Карточки')),
    h('div', { className: 'va-pad va-sky', style: { display: 'grid', gridTemplateColumns: 'repeat(3, minmax(0, 1fr))', gap: '18px' } },
      h(V.StackCard, { icon: 'web', title: 'Веб', text: 'Быстрые сайты и веб-приложения с серверным рендерингом.', tags: ['SvelteKit', 'Next.js'] }),
      h(V.StackCard, { icon: 'mobile', title: 'Мобайл', text: 'Приложения для iOS и Android из одной кодовой базы.', tags: ['React Native', 'Flutter'] }),
      h(V.StackCard, { icon: 'infra', title: 'Инфра\u00ADструктура', text: 'Одинаковое окружение — от ноутбука до продакшена.', tags: ['Docker'] }))
    ),
    h('section', { className: 'pv-block' }, h('h2', { className: 'pv-name' }, 'AeroWindow', h('span', null, ' · Иллюстрации')),
    h('div', { className: 'va-pad va-sky' },
      h(V.AeroWindow, { url: '[ваш-домен].dev', label: 'SvelteKit · Next.js', style: { width: '420px', height: '200px' } },
        h('div', { style: { width: '55%', height: '16px', borderRadius: '8px', background: 'linear-gradient(90deg, var(--violet-500), var(--lilac))' } }),
        h('div', { style: { width: '80%', height: '9px', borderRadius: '5px', background: 'var(--lilac-tint)' } }),
        h('div', { style: { width: '64%', height: '9px', borderRadius: '5px', background: 'var(--lilac-tint)' } })))
    )
  ));
</script>
</body>
</html>
